# Builds the Android app (APK) and puts it on the Releases page.
# The newest one is always at:
#   https://github.com/traveller66/ammon-family-values/releases/latest/download/ammon-family-values.apk
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE_BASE64    the signing key file, as text
#   ANDROID_KEYSTORE_PASSWORD  its password
# Every APK must be signed with the same key, or Android will refuse to install it over the last one.
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing key is set up
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions), then run this again."
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install the Android shell (Capacitor)
        run: npm install --no-audit --no-fund

      - name: Make the Android project
        run: |
          npx cap add android
          node tools/android-setup.mjs "${{ github.run_number }}"
          npx cap sync android

      - name: Build and sign the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias=afv \
            -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"

      - name: Put the APK on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$apk"
          cp "$apk" ammon-family-values.apk
          gh release create "v1.${{ github.run_number }}" ammon-family-values.apk \
            --title "Ammon Family Values 1.${{ github.run_number }}" \
            --notes "Install: open this page on the phone, tap ammon-family-values.apk, then Install. It installs over the previous version and keeps the budget." \
            --latest

      - name: Clean up the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
